services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U backend -d backend"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://backend:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: .
      target: runtime
    init: true
    env_file: .env
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://backend:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/backend
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
