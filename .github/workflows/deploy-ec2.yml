name: Deploy backend to EC2

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      REVISION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate deployment settings
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION" && test -n "$ROLE_ARN"
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-ec2-${{ github.run_id }}
      - name: Deploy the CI-tested commit through SSM
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          sha = os.environ["REVISION"]
          # SSM runs as root. Git and deployment run as the repository owner.
          command = (
              "cd /home/ubuntu/apps/link-shortner-backend && "
              "git fetch --no-tags origin main && "
              f"git show {sha}:scripts/deploy-ec2.sh | bash -s -- {sha}"
          )
          import shlex
          pathlib.Path("parameters.json").write_text(json.dumps({
              "commands": ["set -eu", "sudo -u ubuntu bash -o pipefail -c " + shlex.quote(command)],
              "executionTimeout": ["2100"]
          }))
          PY
          command_id=$(aws ssm send-command             --instance-ids "$INSTANCE_ID"             --document-name AWS-RunShellScript             --parameters file://parameters.json             --timeout-seconds 120             --comment "LnkShrt $REVISION"             --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          # SSM invocation records can take a few seconds to become visible.
          for attempt in $(seq 1 220); do
            status=$(aws ssm get-command-invocation               --command-id "$command_id" --instance-id "$INSTANCE_ID"               --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed: $status"
                exit 1 ;;
            esac
            sleep 10
          done
          test "$status" = Success
          echo "Deployment completed for $REVISION" >> "$GITHUB_STEP_SUMMARY"
      - name: Check public HTTPS health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5             --connect-timeout 10 --max-time 20 https://l.utpx.in/health-check
