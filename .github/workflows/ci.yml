name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, build and HTTP tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Strict application and test type checks
        run: npm run typecheck
      - name: Build production output
        run: npm run build
      - name: Test compiled application
        run: npm run test:ci
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-node-${{ matrix.node }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: backend_test
          POSTGRES_PASSWORD: backend_test
          POSTGRES_DB: backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend_test -d backend_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://backend_test:backend_test@127.0.0.1:5432/backend_test
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply committed migrations to an empty database
        run: npx prisma migrate deploy
      - name: Build production output
        run: npm run build
      - name: Test real database and Redis services
        run: npm run test:integration:ci
      - name: Save integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests
          path: integration-results.xml
          if-no-files-found: ignore
          retention-days: 14
